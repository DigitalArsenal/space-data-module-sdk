name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Bump deliberately, in the same commit as any change that depends on it.
  EMSDK_VERSION: "6.0.5"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # A matrix lane is EVIDENCE, not a race. With fail-fast the first lane to
      # die cancels its healthy sibling, and the cancelled lane's log stops
      # mid-stream — which is exactly how "the runner died" was misread as
      # "these seven tests failed" off a truncated TAP stream. Both lanes report.
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Python FlatBuffers runtime
        run: python3 -m pip install flatbuffers
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # PINNED, never "latest". This repo enforces a pinned compile contract
      # (clang wasm32-wasip1-threads for the isomorphic artifact, a vendored
      # sdn-emception for the single-thread artifact) and validates emitted
      # wasm against it. A floating toolchain under a pinned guard means the
      # gate can change verdict with no commit — the toolchain is part of the
      # contract, so it is pinned here and bumped deliberately.
      - name: Install pinned emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm ci
      - name: npm test (with runner resource sampler)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          # The runner has been dying mid-suite with "received a shutdown
          # signal" and no failing test. That is a VM-level event, so sample
          # VM-level state straight into the step log (the only channel that
          # survives the runner's death: post-steps and artifacts do not run).
          (
            while true; do
              printf 'RSAMPLE %s mem_total=%s mem_used=%s mem_free=%s buff_cache=%s mem_avail=%s swap_used=%s disk_used=%s disk_avail=%s disk_pct=%s tmp_used=%s procs=%s rss_sum_mb=%s top=[%s]\n' \
                "$(date -u +%H:%M:%S)" \
                $(free -m | awk '/^Mem:/{print $2, $3, $4, $6, $7}') \
                "$(free -m | awk '/^Swap:/{print $3}')" \
                $(df -m / | awk 'NR==2{print $3, $4, $5}') \
                "$(du -sm /tmp 2>/dev/null | awk '{print $1}')" \
                "$(ps -e --no-headers | wc -l)" \
                "$(ps -eo rss --no-headers | awk '{s+=$1} END {printf "%d", s/1024}')" \
                "$(ps -eo rss,comm --no-headers --sort=-rss | head -4 | awk '{printf "%s=%dMB ", $2, $1/1024}')"
              # CPU is the dimension the first diagnostic run did not capture, and
              # the only one left that can starve the runner's own heartbeat while
              # memory and disk stay healthy. steal_pct exposes host contention.
              printf 'CSAMPLE %s loadavg=%s runnable_blocked=%s cpu[us,sy,id,wa,st]=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(cut -d' ' -f1-3 /proc/loadavg | tr ' ' ',')" \
                "$(vmstat 1 2 | tail -1 | awk '{print $1","$2}')" \
                "$(vmstat 1 2 | tail -1 | awk '{print $13","$14","$15","$16","$17}')"
              sleep 3
            done
          ) &
          SAMPLER_PID=$!
          set +e
          npm test
          TEST_STATUS=$?
          set -e
          kill "$SAMPLER_PID" 2>/dev/null || true
          echo "RSAMPLE-END npm test exited with $TEST_STATUS"
          exit "$TEST_STATUS"
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm run check:compliance
