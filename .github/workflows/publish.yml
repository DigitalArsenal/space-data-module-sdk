name: Publish

on:
  push:
    tags:
      - "v*"

# Least privilege (security audit SEC-042/SEC-044): only the publish job holds
# the OIDC id-token npm provenance needs.
permissions: {}

env:
  # MUST match .github/workflows/ci.yml — the tag gate and the merge gate have
  # to be the same gate, or a tag can publish something CI never proved.
  EMSDK_VERSION: "6.0.5"
  # The wasi-threads (wasm32-wasip1-threads) toolchain emsdk cannot provide —
  # see the matching comment in ci.yml and docs/isomorphic-pthreads.md.
  WASI_SDK_VERSION: "33"
  WASI_SDK_SHA256: "0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce"

jobs:
  publish:
    # Publishes with npm provenance from a v* tag, in the npm-publish environment
    # (owner's required reviewers). npm's trusted publisher for
    # space-data-module-sdk should require this environment.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Install Python FlatBuffers runtime
        # Hash-pinned (SEC-042): only the reviewed wheel installs.
        run: python3 -m pip install --require-hashes -r .github/requirements/flatbuffers.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install pinned emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          # The emsdk scripts and release manifest at the commit emsdk's
          # 6.0.5 tag names, never emsdk's moving HEAD (security audit
          # SEC-042). Bump together with EMSDK_VERSION, in both workflows.
          git checkout --detach dfb9d1a46c3bb8f52e1e6324be23123b9d73c190
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Install pinned wasi-sdk
        run: |
          curl -sSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          echo "${WASI_SDK_SHA256}  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "$RUNNER_TEMP/wasi-sdk/bin" >> "$GITHUB_PATH"
          echo "SDN_WASI_CLANG=$RUNNER_TEMP/wasi-sdk/bin/wasm32-wasi-clang" >> "$GITHUB_ENV"
          echo "SDN_WASI_CLANGXX=$RUNNER_TEMP/wasi-sdk/bin/wasm32-wasi-clang++" >> "$GITHUB_ENV"
          echo "SDN_WASI_SYSROOT=$RUNNER_TEMP/wasi-sdk/share/wasi-sysroot" >> "$GITHUB_ENV"
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm ci
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm test
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm run check:compliance
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm run check:generated-bindings
      - run: source "$RUNNER_TEMP/emsdk/emsdk_env.sh" && npm publish
